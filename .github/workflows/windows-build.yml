name: Windows Build

on:
  push:
    branches:
      - Desktop-Windows-Verison
  pull_request:
    branches:
      - Desktop-Windows-Verison
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    name: Build NoorConnect for Windows x64
    runs-on: windows-2022
    env:
      APP_VERSION: 1.0.0

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          architecture: x64

      - name: Pin and verify JDK 21
        shell: pwsh
        run: ./scripts/pin-jdk21.ps1

      - name: Build TDLib JNI for Windows x64
        shell: pwsh
        run: ./scripts/build-tdlib-windows.ps1

      - name: Install WiX Toolset
        shell: pwsh
        run: |
          $wixRoot = Get-ChildItem "${env:ProgramFiles(x86)}\WiX Toolset*" -Directory |
            Sort-Object FullName -Descending |
            Select-Object -First 1
          if (-not $wixRoot) {
            choco install wixtoolset --version=3.14.1.20250415 --yes --no-progress
            $wixRoot = Get-ChildItem "${env:ProgramFiles(x86)}\WiX Toolset*" -Directory |
              Sort-Object FullName -Descending |
              Select-Object -First 1
          }
          if (-not $wixRoot) {
            throw "WiX Toolset 3.14.1 was not found on the runner after installation."
          }
          $wixBin = Join-Path $wixRoot.FullName "bin"
          if (-not (Test-Path (Join-Path $wixBin "candle.exe"))) {
            throw "WiX candle.exe is missing from $wixBin."
          }
          Add-Content -Path $env:GITHUB_PATH -Value $wixBin

      - name: Verify Java and jpackage
        shell: pwsh
        run: ./scripts/pin-jdk21.ps1 -VerifyOnly

      - name: Run desktop tests
        shell: pwsh
        run: |
          ./scripts/pin-jdk21.ps1 -VerifyOnly
          .\gradlew.bat -p desktop clean test --no-daemon --console=plain

      - name: Build Windows application image
        shell: pwsh
        run: |
          ./scripts/pin-jdk21.ps1 -VerifyOnly
          .\gradlew.bat -p desktop createDistributable --no-daemon --console=plain

      - name: Build Windows setup EXE
        shell: pwsh
        run: |
          ./scripts/pin-jdk21.ps1 -VerifyOnly
          .\gradlew.bat -p desktop packageExe --no-daemon --console=plain

      - name: Stage and verify final artifacts
        shell: pwsh
        run: ./scripts/verify-windows-distribution.ps1 -BinaryRoot "desktop/build/compose/binaries" -ArtifactRoot "artifacts" -Version $env:APP_VERSION

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: NoorConnect-Windows-Installer
          path: artifacts/installer/NoorConnect-Setup-${{ env.APP_VERSION }}.exe
          if-no-files-found: error
          retention-days: 30

      - name: Upload portable Windows application
        uses: actions/upload-artifact@v4
        with:
          name: NoorConnect-Windows-Portable
          path: artifacts/portable/NoorConnect-${{ env.APP_VERSION }}/
          if-no-files-found: error
          retention-days: 30

      - name: Upload build reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: NoorConnect-Windows-Build-Logs
          path: |
            desktop/build/reports/**
            desktop/build/test-results/**
            desktop/build/compose/logs/**
          if-no-files-found: ignore
          retention-days: 7
