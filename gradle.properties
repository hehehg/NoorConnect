org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
# "Could not connect to Kotlin compile daemon" (common on Windows — antivirus or a firewall
# often blocks the daemon's local socket) falls back automatically and still succeeds, but
# retries slow every build down. This skips the separate daemon process entirely.
kotlin.compiler.execution.strategy=in-process
# Rename this once you pick your final app identity — do it once, at the start.
APP_NAMESPACE_ROOT=com.noorconnect
